<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baba is Random</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.0.7/css/all.css"
    />
    <link
      href=" https://cdn.jsdelivr.net/npm/bulma-extensions@6.2.7/dist/css/bulma-extensions.min.css "
      rel="stylesheet"
    />
    <script src="scripts/code-logic.js"></script>
  </head>
  <body>
    <!-- HEADER -->

    <section class="hero baba-hero-wrapper clearfix">
      <img
        class="image baba-hero-image"
        src="./media/gif/titulo_babaiscool3.gif"
      />
    </section>

    <!-- SELECTION VIEW -->

    <div id="baba-form" class="baba-form">
      <!-- TITLE -->

      <section class="section baba-padded-section">
        <div class="container has-text-centered">
          <h1 class="title baba-title">
            What kind of level do you want to play?
          </h1>
        </div>
      </section>

      <!-- CHECKBOXES -->

      <section class="section baba-padded-section">
        <div class="container has-text-centered baba-checkboxes">
          <div class="columns is-1 is-multiline">
            <div class="column">
              <dd id="baba-check-wrap">
                <input type="checkbox" value="0" id="baba-check-1" />
                <label for="baba-check-1"
                  >Baba is <span class="baba-text-chill">CHILL</span></label
                >
              </dd>
            </div>
            <div class="column">
              <dd id="baba-check-wrap">
                <input type="checkbox" value="1" id="baba-check-2" />
                <label for="baba-check-2"
                  >Baba is <span class="baba-text-eureka">EUREKA</span></label
                >
              </dd>
            </div>
            <div class="column">
              <dd id="baba-check-wrap">
                <input type="checkbox" value="2" id="baba-check-3" />
                <label for="baba-check-3"
                  >Baba is <span class="baba-text-boom">BOOM</span></label
                >
              </dd>
            </div>
            <div class="column">
              <dd id="baba-check-wrap">
                <input type="checkbox" value="3" id="baba-check-4" />
                <label for="baba-check-4"
                  >Baba is <span class="baba-text-comfy">COMFY</span></label
                >
              </dd>
            </div>
          </div>
        </div>
      </section>

      <!-- GENERATE BUTTON -->

      <section class="section">
        <div class="container has-text-centered baba-button-wrapper">
          <button
            class="button is-large baba-button"
            onclick="getRandomLevel(event)"
          >
            Generate code!
          </button>
        </div>
      </section>
    </div>

    <!-- GET CODE VIEW -->

    <div id="baba-get-level" class="baba-get-level">
      <div class="baba-get-level-bg-wrapper">
        <div class="baba-get-level-bg-img"></div>
      </div>
      <!-- TITLE -->

      <section class="section baba-padded-section">
        <div class="container has-text-centered">
          <h1 class="title baba-title">Here's your level, enjoy!</h1>
        </div>
      </section>

      <!-- INPUT -->

      <section class="section baba-padded-section">
        <div class="column is-5 m-auto">
          <div
            onclick="copyText(event)"
            class="control has-icons-right baba-input-wrapper"
          >
            <input
              id="baba-level-code"
              readonly
              class="baba-input input is-large"
              type="text"
            />
            <span class="baba-input-icon-wrapper icon is-right">
              <i class="baba-input-icon fas fa-copy"></i>
            </span>
          </div>
        </div>
      </section>

      <!-- BUTTONS -->

      <section class="section has-text-centered">
        <div class="buttons is-centered baba-button-wrapper">
          <button
            class="baba-button-reroll button is-large"
            onclick="getRandomLevel(event)"
          >
            Reroll!
          </button>
          <button
            class="baba-button-restart button is-large"
            onclick="resetView(event)"
          >
            Restart!
          </button>
        </div>
      </section>

      <!-- SNACKBAR -->

      <div id="snackbar">Level code copied!</div>
    </div>
  </body>
</html>
